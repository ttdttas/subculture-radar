# ─────────────────────────────────────────────
#  서브컬쳐 레이더 설정 파일
#  게임 추가/삭제, 검색어, 키워드를 여기서 바꾸면 됩니다.
# ─────────────────────────────────────────────

[settings]
# --loop 모드(내 PC/서버에서 상시 실행)일 때 실행 시각 (한국시간)
schedule = ["07:50", "11:50", "18:50"]
# 이 시간보다 오래된 글은 "새 소식"으로 치지 않음
lookback_hours = 14
# 게임별 카테고리당 최대 표시 개수
max_per_section = 3
# 이미 보낸 소식을 기억하는 기간(일) — 같은 소식 중복 알림 방지
seen_retention_days = 7
# 구글 트렌드 급상승 검색어를 볼 국가
trend_geos = ["KR", "US", "JP"]

# ─── 분류 키워드 (영문은 단어 단위, 한글은 포함 여부로 판단) ───
[keywords]
leak = ["유출", "루머", "찌라시", "베타", "데이터마이닝", "데마", "썰", "카더라",
        "leak", "leaks", "leaked", "rumor", "rumour", "beta", "datamine", "datamined", "speculation"]
official = ["공식", "발표", "공개", "업데이트", "버전", "픽업", "배너", "특별 방송", "특별방송", "프리뷰",
            "생방송", "리딤", "쿠폰", "교환 코드", "점검", "콜라보", "출시", "트레일러", "PV", "신규 캐릭터", "신캐", "신규 학생",
            "official", "announce", "announced", "announcement", "livestream", "special program", "banner",
            "update", "version", "trailer", "redeem", "maintenance", "collab", "collaboration", "teaser", "drip"]
hot = ["논란", "사과", "보상", "화제", "난리", "이슈", "매출", "1위", "역대", "불만", "환불", "버그", "오류",
       "서버", "밈", "확률", "천장", "너프", "하향", "상향",
       "controversy", "apology", "compensation", "backlash", "outrage", "record", "revenue", "grossing",
       "bug", "viral", "drama", "nerf", "buff", "boycott"]
# 이 단어가 제목/플레어에 있으면 아예 제외 (팬아트·코스프레·짤 위주 글 거르기). 보고 싶으면 지우세요.
exclude = ["팬아트", "코스프레", "fanart", "fan art", "art by", "cosplay", "OC", "artwork", "comic", "meme", "shitpost",
           "@"]

# ─── 게임 목록 ───
# aliases          : 구글 트렌드 급상승 검색어에서 이 게임을 찾을 때 쓰는 이름들
# news_ko / news_en: 구글 뉴스 검색어 (한국어 / 영어)
# subreddits       : 커뮤니티 화제글을 볼 Reddit 서브레딧
# suggest_ko / _en : 자동완성(사람들이 많이 검색하는 조합)을 뽑을 씨앗 검색어
# youtube_channels : (선택) 공식 유튜브 채널 ID. 채널 페이지 → 공유 → 채널 ID 복사
# color            : 디스코드 카드 색 (16진수)

[[games]]
id = "bluearchive"
name = "블루 아카이브"
emoji = "📘"
color = "128AFA"
aliases = ["블루아카이브", "블루 아카이브", "블루아카", "Blue Archive", "ブルーアーカイブ", "ブルアカ"]
news_ko = ["블루아카이브", "블루 아카이브"]
news_en = ["\"Blue Archive\""]
subreddits = ["BlueArchive"]
suggest_ko = ["블루아카이브", "블루아카 ", "블아 신규"]
suggest_en = ["blue archive "]
youtube_channels = []

