# ─────────────────────────────────────────────
#  서브컬쳐 레이더 설정 파일
#  게임 추가/삭제, 검색어, 키워드를 여기서 바꾸면 됩니다.
# ─────────────────────────────────────────────

[settings]
# 웹사이트 주소 (알림 메시지에 링크로 붙음)
site_url = "https://ttdttas.github.io/subculture-radar/"
# 수집 간격(분). GitHub 에서는 .github/workflows/radar.yml 의 cron 이 실제 간격을 정함
interval_minutes = 10
# 디스코드/텔레그램 알림 시각 (한국시간). 직전 알림 이후 새 소식을 묶어서 보냄
notify_times = ["07:50", "11:50", "18:50"]
# 알림 시각부터 이 시간(분) 안에 실행되면 알림 (GitHub 실행이 밀려도 놓치지 않게)
notify_window_minutes = 60
# 검색어(자동완성·나무위키)는 요청이 많아서 이 간격(분)으로만 새로 고침
keyword_refresh_minutes = 30
# 한 회차 수집 시간 제한(초). 넘으면 남은 출처는 다음 회차로 (GitHub 실행이 잘리지 않게)
max_run_seconds = 300
# 뉴스는 이 시간 안에 나온 것만, 커뮤니티 글은 이 시간 안에 쓴 것만 수집
lookback_hours = 14
community_hours = 24
# 사이트에 보관할 기간(일)
store_days = 14
# 사이트에 보관할 최대 글 수 (너무 많으면 휴대폰에서 느려짐)
store_max_items = 3000
# 알림에서 게임별 카테고리당 최대 표시 개수
max_per_section = 3
# 구글 트렌드 급상승 검색어를 볼 국가
trend_geos = ["KR", "US", "JP"]
# 영어·일본어·중국어 제목을 한국어로 자동 번역 (원문도 함께 보관)
translate = true

# ─── 분류 키워드 (영문은 단어 단위, 한글은 포함 여부로 판단) ───
[keywords]
leak = ["유출", "루머", "찌라시", "베타", "데이터마이닝", "데마", "썰", "카더라",
        "leak", "leaks", "leaked", "rumor", "rumour", "beta", "datamine", "datamined", "speculation"]
official = ["공식", "발표", "공개", "업데이트", "버전", "픽업", "배너", "특별 방송", "특별방송", "프리뷰",
            "생방송", "리딤", "쿠폰", "교환 코드", "점검", "콜라보", "출시", "트레일러", "PV", "신규 캐릭터", "신캐", "신규 학생",
            "official", "announce", "announced", "announcement", "livestream", "special program", "banner",
            "update", "version", "trailer", "redeem", "maintenance", "collab", "collaboration", "teaser", "drip"]
hot = ["논란", "사과", "보상", "화제", "난리", "이슈", "매출", "1위", "역대", "불만", "환불", "버그", "오류",
       "서버", "밈", "확률", "천장", "너프", "하향", "상향",
       "controversy", "apology", "compensation", "backlash", "outrage", "record", "revenue", "grossing",
       "bug", "viral", "drama", "nerf", "buff", "boycott"]
# 이 단어가 제목/플레어에 있으면 아예 제외 (팬아트·코스프레·짤 위주 글 거르기). 보고 싶으면 지우세요.
exclude = ["팬아트", "코스프레", "fanart", "fan art", "art by", "cosplay", "OC", "artwork", "comic", "meme", "shitpost",
           "@", "🔞", "후방", "ㅇㅎ", "약후", "nsfw"]
# 디시 말머리 / 아카 탭 / Reddit 플레어가 이것이면 제외 (그림·창작 글 거르기)
exclude_flair = ["그림", "창작", "팬아트", "만화", "코스프레", "짤", "AI", "Fan Art", "Fanart", "OC", "Meme", "Cosplay", "Artwork"]

