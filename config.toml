# ─── 게임 목록 ───
# aliases          : 구글 트렌드 급상승 검색어에서 이 게임을 찾을 때 쓰는 이름들
# news_ko / news_en: 구글 뉴스 검색어 (한국어 / 영어)
# dcinside         : 디시인사이드 마이너 갤러리 ID (개념글 수집)
# arca             : 아카라이브 채널 주소 (베스트 수집)
# subreddits       : Reddit 서브레딧 (클라우드 접속이 막히면 자동으로 건너뜀)
# suggest_ko       : 구글·네이버·유튜브 자동완성을 뽑을 씨앗 검색어
# suggest_en       : 구글(영어) 자동완성 씨앗 검색어
# youtube_channels : (선택) 공식 유튜브 채널 ID. 채널 페이지 → 공유 → 채널 ID 복사
# color            : 디스코드 카드 색 (16진수)

