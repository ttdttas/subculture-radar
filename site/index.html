<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0f17">
<title>서브컬쳐 레이더</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #0d0f17; --bg2: #141724; --card: #191d2d; --card-hover: #1f2438; --line: #262b40;
    --text: #e8eaf3; --sub: #9aa0b8; --mute: #646a85;
    --accent: #ff5c8a; --accent2: #7c8cff;
    --leak: #ffb547; --official: #4fd1c5; --hot: #ff6b6b;
    --t-hot: #ff4757; --t-warm: #ff9f43; --t-mild: #ffd43b; --t-cold: #8a90a8;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; min-height: 100vh;
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(124,140,255,.12), transparent 60%),
      radial-gradient(700px 400px at -10% 10%, rgba(255,92,138,.10), transparent 60%), var(--bg);
    background-attachment: fixed;
  }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 80px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-size: 24px;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 6px 24px rgba(255,92,138,.35); }
  h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .tagline { color: var(--sub); font-size: 13px; margin-top: 2px; }
  .status { text-align: right; font-size: 13px; color: var(--sub); }
  .status b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3ddc97; margin-right: 6px;
    box-shadow: 0 0 10px #3ddc97; vertical-align: 1px; animation: pulse 2s infinite; }
  .dot.stale { background: var(--leak); box-shadow: 0 0 10px var(--leak); }
  @keyframes pulse { 50% { opacity: .4; } }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .seg { display: inline-flex; background: var(--bg2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; cursor: pointer; color: var(--sub); font-weight: 600; font-size: 14px; flex: none; }
  .seg button.on { background: var(--card-hover); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .search { flex: 1; min-width: 200px; background: var(--bg2); border: 1px solid var(--line); border-radius: 11px; padding: 9px 12px; font-size: 14px; outline: none; }
  .search:focus { border-color: var(--accent2); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .chip { border: 1px solid var(--line); background: var(--bg2); border-radius: 999px; padding: 6px 13px; cursor: pointer;
    font-size: 14px; font-weight: 600; color: var(--sub); display: inline-flex; gap: 6px; align-items: center; transition: .15s; }
  .chip:hover { color: var(--text); }
  .chip.on { color: var(--text); border-color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 16%, var(--bg2)); }
  .chip .n { font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .chip.on .n { color: var(--text); opacity: .8; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } .side { position: static !important; } }

  .top { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 22px; }
  @media (max-width: 760px) { .top { grid-template-columns: 1fr; } }
  .topcard { position: relative; border-radius: var(--radius); padding: 16px 16px 14px; overflow: hidden;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 22%, var(--card)), var(--card) 70%);
    border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line));
    display: flex; flex-direction: column; gap: 6px; min-height: 140px; transition: transform .15s; }
  .topcard:hover { transform: translateY(-2px); }
  .rank { font-size: 12px; font-weight: 800; letter-spacing: .08em; color: var(--c); }
  .topcard .t { font-weight: 700; font-size: 15.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .topcard .orig { font-size: 12px; color: var(--sub); opacity: .75; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .topcard .m { margin-top: auto; font-size: 12.5px; color: var(--sub); }

  .sechead { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
  .sechead .left { display: flex; gap: 8px; flex-wrap: wrap; }
  .tools { display: flex; gap: 12px; align-items: center; font-size: 13px; color: var(--sub); }
  .tools label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .linkbtn { border: 0; background: none; color: var(--accent2); cursor: pointer; padding: 0; font-size: 13px; }
  .feed { display: flex; flex-direction: column; gap: 8px; }
  .item { display: grid; grid-template-columns: 4px 1fr auto; gap: 14px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 12px 0; transition: .12s; }
  .item:hover { background: var(--card-hover); border-color: #343a55; }
  .item .bar { align-self: stretch; border-radius: 0 4px 4px 0; background: var(--c); }
  .item.read { opacity: .45; }
  .item.read.open, .item.read:hover { opacity: 1; }
  .item .t { font-weight: 600; font-size: 15px; line-height: 1.45; }
  .item .orig { font-size: 12.5px; color: var(--mute); margin-top: 2px; line-height: 1.4; }
  .item .m { font-size: 12.5px; color: var(--sub); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .item { cursor: pointer; }
  .item.open { background: var(--card-hover); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
  .item .acts { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; align-self: start; padding-top: 2px; }
  .item .go { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); color: var(--sub); font-size: 14px; }
  .item .go:hover { color: var(--text); border-color: var(--accent2); background: var(--bg2); }
  .detail { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); cursor: default; }
  .item.open .detail { display: block; animation: fadein .18s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(-4px); } }
  .excerpt { margin: 0 0 12px; padding: 12px 14px; background: var(--bg2); border-left: 3px solid var(--c); border-radius: 0 10px 10px 0; font-size: 14.5px; line-height: 1.65; color: var(--text); }
  .excerpt small { display: block; font-size: 11.5px; color: var(--mute); margin-bottom: 4px; font-weight: 700; letter-spacing: .03em; }
  .nopreview { font-size: 13px; color: var(--sub); margin: 0 0 12px; padding: 10px 12px; background: var(--bg2); border-radius: 10px; }
  .info { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin-bottom: 12px; }
  .info dt { color: var(--mute); } .info dd { margin: 0; color: var(--sub); word-break: break-all; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 10px; font-size: 13.5px; font-weight: 700; border: 1px solid var(--line); background: var(--bg2); color: var(--text); cursor: pointer; }
  .btn.primary { background: var(--c); border-color: var(--c); color: #0d0f17; }
  .btn:hover { filter: brightness(1.12); }
  .item .score { font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; text-align: right; min-width: 34px; }
  .new { font-size: 10px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 4px; padding: 1px 5px; margin-right: 6px; vertical-align: 2px; letter-spacing: .04em; }
  .tr { font-size: 10.5px; font-weight: 700; color: var(--accent2); border: 1px solid rgba(124,140,255,.4); border-radius: 4px; padding: 0 4px; margin-right: 6px; vertical-align: 2px; }
  .badge { font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  .b-official { color: var(--official); background: rgba(79,209,197,.12); }
  .b-leak { color: var(--leak); background: rgba(255,181,71,.13); }
  .b-hot { color: var(--hot); background: rgba(255,107,107,.12); }
  .b-game { color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .flair { font-size: 11.5px; color: var(--sub); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  .rel.high { color: #3ddc97; } .rel.mid { color: var(--leak); } .rel.low { color: var(--hot); }
  .rel { font-size: 11.5px; }
  mark { background: rgba(255,92,138,.3); color: var(--text); border-radius: 3px; padding: 0 1px; }
  .empty { padding: 40px 20px; text-align: center; color: var(--sub); background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); }
  .more { margin-top: 12px; text-align: center; }
  .more button { background: var(--bg2); border: 1px solid var(--line); padding: 9px 18px; border-radius: 10px; cursor: pointer; color: var(--sub); }

  .side { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 16px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .panel h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .panel h3 small { color: var(--mute); font-weight: 500; font-size: 12px; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--sub); margin: -4px 0 12px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; vertical-align: 0; }
  .kwgroup { margin-bottom: 12px; }
  .kwgroup:last-child { margin-bottom: 0; }
  .kwgroup .gname { font-size: 12px; color: var(--sub); margin-bottom: 6px; font-weight: 600; }
  .kw { display: flex; flex-wrap: wrap; gap: 6px; }
  .kw a { font-size: 13px; padding: 4px 10px; border-radius: 8px; border: 1px solid; font-weight: 600; position: relative; transition: .12s; }
  .kw a:hover { filter: brightness(1.2); }
  .kw a.hot  { color: #fff; background: color-mix(in srgb, var(--t-hot) 75%, transparent); border-color: var(--t-hot); box-shadow: 0 0 14px rgba(255,71,87,.35); }
  .kw a.warm { color: #1a1205; background: var(--t-warm); border-color: var(--t-warm); }
  .kw a.mild { color: #1d1802; background: color-mix(in srgb, var(--t-mild) 85%, transparent); border-color: var(--t-mild); }
  .kw a.cold { color: var(--sub); background: var(--bg2); border-color: var(--line); font-weight: 500; }
  .kw a .nb { position: absolute; top: -6px; right: -5px; font-size: 9px; font-weight: 800; background: var(--accent); color: #fff; border-radius: 4px; padding: 0 3px; }
  .hint { font-size: 12px; color: var(--mute); margin-top: 10px; }
  .chart { display: flex; align-items: flex-end; gap: 2px; height: 70px; }
  .chart div { flex: 1; background: var(--accent2); opacity: .55; border-radius: 3px 3px 0 0; min-height: 2px; }
  .chart div:hover { opacity: 1; background: var(--accent); }
  .chartcap { display: flex; justify-content: space-between; font-size: 11px; color: var(--mute); margin-top: 6px; }
  .srcs { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  .srcs span { padding: 2px 8px; border-radius: 6px; background: var(--bg2); border: 1px solid var(--line); color: var(--sub); }
  .srcs span.off { opacity: .4; text-decoration: line-through; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px); background: var(--accent); color: #fff;
    padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; box-shadow: 0 8px 30px rgba(255,92,138,.4); transition: .3s; cursor: pointer; z-index: 10; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .loading { color: var(--sub); padding: 60px 0; text-align: center; }
  footer { margin-top: 40px; font-size: 12px; color: var(--mute); text-align: center; }
  footer a { color: var(--sub); text-decoration: underline; }

  @media (max-width: 600px) {
    .wrap { padding: 18px 14px 60px; }
    .chips { flex-wrap: nowrap; overflow-x: auto; margin: 0 -14px 16px; padding: 0 14px 4px; scrollbar-width: none; }
    .chip { flex: none; }
    .sechead { flex-direction: column; align-items: flex-start; }
    .sechead .left { flex-direction: column; align-items: flex-start; }
    .item .score { display: none; }
    .item { grid-template-columns: 4px 1fr auto; gap: 10px; }
    .topcard { min-height: 0; }
    .top { gap: 8px; }
    .status { text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">📡</div>
      <div>
        <h1>서브컬쳐 레이더</h1>
        <div class="tagline">블루아카 · 원신 · 젠존제 · 스타레일 · 명조 떡밥 모음</div>
      </div>
    </div>
    <div class="status" id="status">불러오는 중…</div>
  </header>

  <div class="controls">
    <div class="seg" id="periodSeg">
      <button data-p="1">1시간</button>
      <button data-p="6">6시간</button>
      <button data-p="24" class="on">24시간</button>
      <button data-p="72">3일</button>
      <button data-p="168">7일</button>
      <button data-p="0">전체</button>
    </div>
    <input class="search" id="q" type="search" placeholder="제목 검색 (원문·번역 모두)… 예: 픽업, 유출, 카프카">
  </div>
  <div class="chips" id="gameChips"></div>

  <div class="layout">
    <main>
      <div id="topWrap"></div>
      <div class="sechead">
        <div class="left">
          <div class="seg" id="secSeg">
            <button data-s="all" class="on">전체</button>
            <button data-s="official">📢 공식</button>
            <button data-s="leak">🕵️ 떡밥·유출</button>
            <button data-s="hot">🔥 화제</button>
          </div>
          <div class="seg" id="srcSeg">
            <button data-k="all" class="on">모든 출처</button>
            <button data-k="news">📰 뉴스</button>
            <button data-k="community">💬 커뮤니티</button>
          </div>
          <div class="seg" id="sortSeg">
            <button data-o="score">⭐ 화제순</button>
            <button data-o="new">🕒 최신순</button>
          </div>
        </div>
        <div class="tools">
          <label><input type="checkbox" id="hideRead"> 읽은 것 숨기기</label>
          <button class="linkbtn" id="markAll">모두 읽음</button>
        </div>
      </div>
      <div class="feed" id="feed"><div class="loading">데이터를 불러오는 중…</div></div>
      <div class="more" id="more"></div>
    </main>

    <aside class="side">
      <div class="panel">
        <h3>🔍 많이 찾는 검색어 <small id="kwUpdated"></small></h3>
        <div class="legend">
          <span><i style="background:var(--t-hot)"></i>매우 인기</span>
          <span><i style="background:var(--t-warm)"></i>인기</span>
          <span><i style="background:var(--t-mild)"></i>보통</span>
          <span><i style="background:var(--t-cold)"></i>낮음</span>
        </div>
        <div id="kwBody"></div>
        <div class="hint">구글·네이버·유튜브 자동완성 순위, 구글 트렌드 급상승, 나무위키 인기 검색어를 합쳐서 매긴 점수예요. 여러 곳에서 상위에 뜰수록 붉어져요.</div>
      </div>
      <div class="panel">
        <h3>⏱ 시간대별 새 소식 <small id="chartMax"></small></h3>
        <div class="chart" id="chart"></div>
        <div class="chartcap"><span>24시간 전</span><span>지금</span></div>
      </div>
      <div class="panel">
        <h3>📡 수집 출처</h3>
        <div class="srcs" id="srcs"></div>
      </div>
    </aside>
  </div>

  <footer>10분마다 자동 수집 · 알림은 매일 07:50 · 11:50 · 18:50 · <a href="https://github.com/ttdttas/subculture-radar" target="_blank" rel="noopener">GitHub</a></footer>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  const S = {
    index: null, items: [], keywords: null,
    period: 24, game: "all", sec: "all", src: "all", q: "", limit: 40,
    sort: store.get("radar-sort", "score"),
    read: new Set(store.get("radar-read", [])), hideRead: store.get("radar-hide-read", false),
    lastVisit: store.get("radar-last-visit", null), open: null,
  };
  $("#hideRead").checked = S.hideRead;
  const syncSeg = (sel, attr, val) => document.querySelectorAll(`${sel} button`).forEach((x) => x.classList.toggle("on", x.dataset[attr] === String(val)));
  syncSeg("#sortSeg", "o", S.sort);

  const getJSON = (u) => fetch(u + "?t=" + Date.now()).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
  const gameMeta = (id) => (S.index?.games || []).find((g) => g.id === id) || { name: id, emoji: "🎮", color: "888888" };
  const gcolor = (id) => "#" + gameMeta(id).color;
  const titleOf = (it) => it.title_ko || it.title;
  const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : "#");
  const timeOf = (it) => new Date(it.published || it.first_seen).getTime();
  const isNew = (it) => S.lastVisit && it.first_seen > S.lastVisit;
  const short = (n) => (n >= 10000 ? (n / 10000).toFixed(1) + "만" : n >= 1000 ? (n / 1000).toFixed(1) + "k" : n);

  function ago(iso) {
    if (!iso) return "";
    const m = Math.floor((Date.now() - new Date(iso)) / 60000);
    if (m < 1) return "방금";
    if (m < 60) return `${m}분 전`;
    if (m < 1440) return `${Math.floor(m / 60)}시간 전`;
    return `${Math.floor(m / 1440)}일 전`;
  }

  function highlight(text) {
    const t = esc(text);
    if (!S.q) return t;
    const ws = S.q.split(/\s+/).filter(Boolean).map((w) => esc(w).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    return ws.length ? t.replace(new RegExp(`(${ws.join("|")})`, "gi"), "<mark>$1</mark>") : t;
  }

  const SEC = { official: ["b-official", "📢 공식"], leak: ["b-leak", "🕵️ 유출"], hot: ["b-hot", "🔥 화제"] };
  const REL = { "높음": "high", "보통": "mid", "낮음": "low" };

  function meta(it) {
    const g = gameMeta(it.game), p = [];
    if (S.game === "all") p.push(`<span class="badge b-game" style="--c:${gcolor(it.game)}">${g.emoji} ${esc(g.name)}</span>`);
    const [cls, label] = SEC[it.section] || SEC.hot;
    p.push(`<span class="badge ${cls}">${label}</span>`);
    if (it.reliability && REL[it.reliability]) p.push(`<span class="rel ${REL[it.reliability]}">신뢰도 ${esc(it.reliability)}</span>`);
    if (it.flair && it.kind === "community") p.push(`<span class="flair">${esc(it.flair)}</span>`);
    p.push(`<span>${esc(it.source)}</span>`);
    if ((it.kind === "community" || it.kind === "reddit") && it.upvotes)
      p.push(`<span>👍 ${short(it.upvotes)} · 💬 ${short(it.comments)}${it.views ? " · 👁 " + short(it.views) : ""}</span>`);
    if (it.traffic) p.push(`<span>검색 ${esc(it.traffic)}</span>`);
    if (it.coverage > 1) p.push(`<span>매체 ${it.coverage}곳</span>`);
    p.push(`<span>${ago(it.published || it.first_seen)}</span>`);
    return p.join("");
  }

  const fmtTime = (iso) => { if (!iso) return "-"; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")} (${ago(iso)})`; };
  function detailHTML(it) {
    const rows = [];
    rows.push(["출처", esc(it.source) + (it.coverage > 1 ? ` 외 ${it.coverage - 1}곳` : "")]);
    if (it.published) rows.push(["올라온 시각", fmtTime(it.published)]);
    rows.push(["레이더 발견", fmtTime(it.first_seen)]);
    if (it.upvotes || it.comments) rows.push(["반응", `👍 ${short(it.upvotes)} · 💬 ${short(it.comments)}${it.views ? " · 👁 " + short(it.views) : ""}`]);
    if (it.flair) rows.push(["말머리", esc(it.flair)]);
    if (it.reliability) rows.push(["신뢰도", esc(it.reliability)]);
    if (it.traffic) rows.push(["검색량", esc(it.traffic)]);
    if (it.title_ko) rows.push(["원문 제목", esc(it.title)]);
    let body;
    if (it.excerpt) body = `<div class="excerpt"><small>본문 미리보기</small>${esc(it.excerpt)}</div>`;
    else if (it.kind === "news") body = `<div class="nopreview">📰 뉴스 기사는 언론사 사이트에서 읽을 수 있어요. 아래 <b>원문 열기</b>를 눌러 주세요.</div>`;
    else if (it.kind === "trend") body = `<div class="nopreview">📈 구글 트렌드에서 지금 급상승 중인 검색어예요.</div>`;
    else if (it.source === "디시 개념글" && !("excerpt" in it)) body = `<div class="nopreview">⏳ 본문 미리보기를 가져오는 중이에요 (다음 수집 때 채워져요)</div>`;
    else body = `<div class="nopreview">글 내용은 원문에서 볼 수 있어요.</div>`;
    return `<div class="detail">${body}
      <dl class="info">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
      <div class="btns">
        <a class="btn primary" href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener" data-url="${esc(it.url)}">원문 열기 ↗</a>
        <button class="btn" data-copy="${esc(safeUrl(it.url))}">🔗 링크 복사</button>
        <button class="btn" data-close>접기</button>
      </div></div>`;
  }

  function renderItem(it) {
    return `<div class="item${S.read.has(it.url) ? " read" : ""}${S.open === it.id ? " open" : ""}" data-id="${esc(it.id)}" data-url="${esc(it.url)}" tabindex="0" role="button" aria-expanded="${S.open === it.id}" style="--c:${gcolor(it.game)}">
      <div class="bar"></div>
      <div>
        <div class="t">${isNew(it) ? '<span class="new">NEW</span>' : ""}${it.title_ko ? '<span class="tr" title="자동 번역">번역</span>' : ""}${highlight(titleOf(it))}</div>
        ${it.title_ko ? `<div class="orig">${highlight(it.title)}</div>` : ""}
        <div class="m">${meta(it)}</div>
        ${detailHTML(it)}
      </div>
      <div class="acts">
        <a class="go" href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener" data-url="${esc(it.url)}" title="원문 열기">↗</a>
        <div class="score" title="화제도 점수">${(it.score || 0).toFixed(1)}</div>
      </div>
    </div>`;
  }

  function renderTop(items) {
    if (S.q || S.sec !== "all" || S.sort === "new") return "";
    const top = items.slice(0, 3);
    if (!top.length) return "";
    return `<div class="top">${top.map((it, i) => {
      const g = gameMeta(it.game);
      return `<a class="topcard" href="${esc(safeUrl(it.url))}" data-top="${esc(it.id)}" style="--c:${gcolor(it.game)}">
        <div class="rank">TOP ${i + 1} · ${g.emoji} ${esc(g.name)}</div>
        <div class="t">${esc(titleOf(it))}</div>
        ${it.title_ko ? `<div class="orig">${esc(it.title)}</div>` : ""}
        <div class="m">${esc(it.source)} · ${ago(it.published || it.first_seen)}</div>
      </a>`;
    }).join("")}</div>`;
  }

  function inPeriod(it) {
    if (!S.period || S.q) return true;
    return timeOf(it) >= Date.now() - S.period * 3600e3;
  }

  function renderChips(pool) {
    const counts = {};
    for (const it of pool) counts[it.game] = (counts[it.game] || 0) + 1;
    const chip = (id, label, n, c) => `<button class="chip${S.game === id ? " on" : ""}" data-g="${id}" ${c ? `style="--c:${c}"` : ""}>${label}<span class="n">${n}</span></button>`;
    $("#gameChips").innerHTML = chip("all", "전체", pool.length) +
      S.index.games.map((g) => chip(g.id, `${g.emoji} ${esc(g.name)}`, counts[g.id] || 0, "#" + g.color)).join("");
  }

  const SRC_LABEL = { naver: "네이버", google: "구글", youtube: "유튜브", google_en: "구글(영어)", namu: "나무위키", trends: "구글 트렌드" };
  function renderKeywords() {
    const kw = S.keywords?.games || {};
    const link = (e) => `<a class="${e.tier}" href="https://search.naver.com/search.naver?query=${encodeURIComponent(e.k)}" target="_blank" rel="noopener"
      title="${esc((e.sources || []).map((s) => SRC_LABEL[s] || s).join(" · "))} · 점수 ${e.score}">${esc(e.k)}${e.new ? '<span class="nb">N</span>' : ""}</a>`;
    const ids = S.game === "all" ? S.index.games.map((g) => g.id) : [S.game];
    $("#kwBody").innerHTML = ids.map((id) => {
      const list = (kw[id] || []).slice(0, S.game === "all" ? 6 : 30);
      if (!list.length) return "";
      const g = gameMeta(id);
      return `<div class="kwgroup">${S.game === "all" ? `<div class="gname">${g.emoji} ${esc(g.name)}</div>` : ""}<div class="kw">${list.map(link).join("")}</div></div>`;
    }).join("") || `<div class="hint">아직 수집 전이에요</div>`;
    $("#kwUpdated").textContent = S.keywords?.updated ? ago(S.keywords.updated) + " 갱신" : "";
  }

  function renderChart() {
    const now = Date.now(), bins = new Array(24).fill(0);
    for (const r of S.index.runs || []) {
      const h = Math.floor((now - new Date(r.t)) / 3600e3);
      if (h >= 0 && h < 24) bins[23 - h] += S.game === "all" ? r.n : (r.c || {})[S.game] || 0;
    }
    const max = Math.max(1, ...bins);
    $("#chart").innerHTML = bins.map((v, i) => `<div style="height:${Math.max(3, (v / max) * 100)}%" title="${23 - i}시간 전 · ${v}개"></div>`).join("");
    $("#chartMax").textContent = `시간당 최대 ${max}개`;
  }

  function renderSources() {
    const kinds = new Set(S.items.map((i) => i.source));
    const has = (pred) => S.items.some(pred);
    const list = [
      ["구글 뉴스", has((i) => i.kind === "news")],
      ["디시 개념글", kinds.has("디시 개념글")],
      ["아카 베스트", kinds.has("아카 베스트")],
      ["Reddit", has((i) => i.kind === "reddit")],
      ["구글 트렌드", has((i) => i.kind === "trend") || true],
      ["나무위키", !!S.keywords?.namu_ok],
    ];
    $("#srcs").innerHTML = list.map(([n, ok]) => `<span class="${ok ? "" : "off"}" title="${ok ? "수집 중" : "최근 수집 안 됨"}">${n}</span>`).join("");
  }

  function render() {
    const pool = S.items.filter((it) => inPeriod(it)).filter((it) => {
      if (!S.q) return true;
      const t = (it.title + " " + (it.title_ko || "")).toLowerCase();
      return S.q.toLowerCase().split(/\s+/).filter(Boolean).every((w) => t.includes(w));
    });
    renderChips(pool);
    let items = S.game === "all" ? pool : pool.filter((it) => it.game === S.game);
    if (S.src !== "all") items = items.filter((it) => (S.src === "news" ? it.kind === "news" || it.kind === "trend" || it.kind === "video" : it.kind === "community" || it.kind === "reddit"));
    items = [...items].sort((a, b) => b.score - a.score);
    $("#topWrap").innerHTML = renderTop(items);
    if (S.sort === "new") items.sort((a, b) => timeOf(b) - timeOf(a));
    if (S.sec !== "all") items = items.filter((it) => it.section === S.sec);
    if (S.hideRead) items = items.filter((it) => !S.read.has(it.url));
    const shown = items.slice(0, S.limit);
    $("#feed").innerHTML = shown.length ? shown.map(renderItem).join("")
      : `<div class="empty">${S.q ? "검색 결과가 없어요" : "이 조건에 맞는 소식이 없어요 😴<br><small>기간을 늘려 보세요</small>"}</div>`;
    $("#more").innerHTML = items.length > S.limit ? `<button id="moreBtn">더 보기 (${items.length - S.limit}개)</button>` : "";
    renderKeywords();
    renderChart();
    renderSources();
    renderStatus();
  }

  function renderStatus() {
    const mins = (Date.now() - new Date(S.index.updated)) / 60000;
    const stale = mins > (S.index.interval_minutes || 10) * 4;
    $("#status").innerHTML = `<span class="dot${stale ? " stale" : ""}"></span><b>${ago(S.index.updated)}</b> 업데이트 · ${S.index.interval_minutes || 10}분마다 자동 수집`;
  }

  function markRead(url) {
    if (!url || S.read.has(url)) return;
    S.read.add(url);
    store.set("radar-read", [...S.read].slice(-3000));
    document.querySelectorAll(`[data-url="${CSS.escape(url)}"]`).forEach((el) => el.classList.add("read"));
  }

  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 6000);
  }

  // 이벤트
  const seg = (sel, attr, key, cast = (v) => v) => $(sel).addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    S[key] = cast(b.dataset[attr]); S.limit = 40; syncSeg(sel, attr, b.dataset[attr]);
    if (key === "sort") store.set("radar-sort", S.sort);
    render();
  });
  seg("#periodSeg", "p", "period", Number);
  seg("#secSeg", "s", "sec");
  seg("#srcSeg", "k", "src");
  seg("#sortSeg", "o", "sort");
  $("#gameChips").addEventListener("click", (e) => { const b = e.target.closest(".chip"); if (!b) return; S.game = b.dataset.g; S.limit = 40; render(); });
  let qt;
  $("#q").addEventListener("input", (e) => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); S.limit = 40; render(); }, 200); });
  $("#hideRead").addEventListener("change", (e) => { S.hideRead = e.target.checked; store.set("radar-hide-read", S.hideRead); render(); });
  $("#markAll").addEventListener("click", () => { document.querySelectorAll("#feed [data-url]").forEach((el) => markRead(el.dataset.url)); if (S.hideRead) render(); });
  function toggle(el, force) {
    const id = el.dataset.id, open = force ?? !el.classList.contains("open");
    document.querySelectorAll(".item.open").forEach((x) => { if (x !== el) { x.classList.remove("open"); x.setAttribute("aria-expanded", "false"); } });
    el.classList.toggle("open", open); el.setAttribute("aria-expanded", String(open));
    S.open = open ? id : null;
    if (open) markRead(el.dataset.url);
  }
  document.addEventListener("click", (e) => {
    const a = e.target.closest("a[data-url]");
    if (a) { markRead(a.dataset.url); return; }                       // 원문 링크는 그대로 새 탭
    const top = e.target.closest("[data-top]");
    if (top) {
      e.preventDefault();
      const el = document.querySelector(`.item[data-id="${CSS.escape(top.dataset.top)}"]`);
      if (el) { toggle(el, true); el.scrollIntoView({ behavior: "smooth", block: "center" }); }
      else window.open(top.href, "_blank", "noopener");
      return;
    }
    const cp = e.target.closest("[data-copy]");
    if (cp) { navigator.clipboard?.writeText(cp.dataset.copy).then(() => toast("🔗 링크를 복사했어요")).catch(() => {}); return; }
    const cl = e.target.closest("[data-close]");
    if (cl) { toggle(cl.closest(".item"), false); return; }
    if (e.target.closest(".detail")) return;                          // 펼친 내용 안 클릭은 무시 (글자 복사 등)
    const it = e.target.closest(".item");
    if (it && !window.getSelection()?.toString()) toggle(it);
  });
  document.addEventListener("keydown", (e) => {
    const it = e.target.closest?.(".item");
    if (it && (e.key === "Enter" || e.key === " ") && e.target === it) { e.preventDefault(); toggle(it); }
  });
  document.addEventListener("auxclick", (e) => { const a = e.target.closest("a[data-url]"); if (a) markRead(a.dataset.url); });
  $("#more").addEventListener("click", (e) => { if (e.target.id === "moreBtn") { S.limit += 40; render(); } });
  $("#toast").addEventListener("click", () => { window.scrollTo({ top: 0, behavior: "smooth" }); $("#toast").classList.remove("show"); });

  async function load(first) {
    const [index, items, keywords] = await Promise.all([
      getJSON("data/index.json"), getJSON("data/items.json"), getJSON("data/keywords.json").catch(() => null),
    ]);
    const prevUpdated = S.index?.updated;
    S.index = index; S.items = items.items || []; S.keywords = keywords;
    if (!first && prevUpdated !== index.updated) {
      const n = S.items.filter((it) => it.first_seen > prevUpdated).length;
      if (n) toast(`🔔 새 소식 ${n}개가 들어왔어요`);
    }
    render();
  }

  // 시작 + 2분마다 새 데이터 확인
  (async () => {
    try { await load(true); }
    catch {
      $("#status").textContent = "아직 수집된 데이터가 없어요";
      $("#feed").innerHTML = `<div class="empty">첫 수집이 끝나면 여기에 떡밥이 쌓여요</div>`;
      return;
    }
    // 'NEW' 기준: 지난번에 페이지를 떠날 때 보고 있던 데이터 시각
    const saveVisit = () => { if (S.index?.updated) store.set("radar-last-visit", S.index.updated); };
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveVisit(); });
    window.addEventListener("pagehide", saveVisit);
    setInterval(async () => {
      try {
        const idx = await getJSON("data/index.json");
        if (idx.updated !== S.index.updated) await load(false);
        else renderStatus();
      } catch {}
    }, 120000);
  })();
})();
</script>
</body>
</html>
