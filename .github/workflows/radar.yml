name: 서브컬쳐 레이더

on:
  schedule:
    # GitHub 은 UTC 기준. 한국시간 = UTC + 9
    - cron: "50 22 * * *"   # 07:50 KST 아침
    - cron: "50 2 * * *"    # 11:50 KST 점심
    - cron: "50 9 * * *"    # 18:50 KST 저녁
  workflow_dispatch: {}     # Actions 탭에서 "Run workflow" 버튼으로 수동 실행
  push:                     # 웹사이트 화면(index.html)을 고치면 수집 없이 사이트만 다시 배포
    branches: [main]
    paths: ["site/index.html"]

permissions:
  contents: write           # 상태(state/)와 리포트(reports/)를 저장소에 다시 커밋하기 위해

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 수집 & 알림
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python radar.py

      - name: 상태·리포트 저장
        run: |
          git config user.name  "subculture-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state reports site/data
          git diff --cached --quiet || git commit -m "radar: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 수집"
          git push

  # 웹사이트(GitHub Pages) 배포
  site:
    needs: radar
    if: ${{ always() && (needs.radar.result == 'success' || needs.radar.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main            # 방금 수집해서 커밋한 최신 데이터 포함
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
