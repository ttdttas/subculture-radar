name: 서브컬쳐 레이더

on:
  schedule:
    # 10분 간격 실행은 cron-job.org 가 workflow_dispatch 로 깨워 줌 (GitHub 예약은 자주 밀려서)
    # 이건 cron-job.org 가 멈췄을 때를 대비한 1시간 간격 예비 실행
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      notify:
        description: "지금 바로 디스코드/텔레그램 알림도 보내기"
        type: boolean
        default: false
  push:                       # 화면(index.html)이나 코드를 고치면 바로 한 번 실행
    branches: [main]
    paths: ["site/index.html", "radar.py", "config.toml"]

permissions:
  contents: write             # data 브랜치에 상태·사이트 데이터 저장
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # 상태·누적 데이터는 data 브랜치에 (main 기록이 지저분해지지 않게, 매번 덮어씀)
      - name: 이전 데이터 가져오기
        run: |
          mkdir -p work
          if git ls-remote --exit-code origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git --work-tree=work checkout FETCH_HEAD -- .
          fi
          ls -R work | head -20

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 수집
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python radar.py --data-dir work ${{ inputs.notify && '--notify-now' || '' }} > /dev/null

      - name: 데이터 저장 (data 브랜치)
        run: |
          cd work
          git init -q -b data
          git config user.name  "subculture-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: 사이트 묶기
        run: |
          mkdir -p _site/data
          cp site/index.html _site/
          cp work/site/data/*.json _site/data/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
